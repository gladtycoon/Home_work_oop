[tool.poetry]
name = "home-work-oop"
version = "0.1.0"
description = "Домашняя работа по разделу ООП"
authors = ["Ivan Sokolskiy <Gladtycoon@gmail.com>"]
license = "SkyPro"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.14"
pytest = ">=9.0.2,<10.0.0"
isort = ">=7.0.0,<8.0.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = ">=7.0.0,<8.0.0"
flake8 = ">=7.3.0,<8.0.0"
black = ">=25.12.0,<26.0.0"
mypy = ">=1.19.1,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Остальные секции [tool.*] оставляем как есть
[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119

[tool.isort]
line_length = 119